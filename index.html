<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planned Pooling</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Planned Pooling</h1>

  <div class="page">
  <div class="fabricSide">
  <div class="layout">
    <div class="dimension top">
      <label for="stitches" id="stitchesLabel">Stitches</label>
      <input type="number" id="stitches" value="140" min="1"
             aria-label="Stitches per row">
    </div>

    <div class="canvasArea">
      <div id="canvasWrap">
        <canvas id="fabric"></canvas>
      </div>
      <div class="handle handleRight"  id="handleRight"  title="Drag to change stitches"></div>
      <div class="handle handleBottom" id="handleBottom" title="Drag to change rows"></div>
      <div class="handle handleCorner" id="handleCorner" title="Drag to change both"></div>

      <span class="seamLabel seamLabelLeft">Seam</span>
      <span class="seamLabel seamLabelRight">Seam</span>
    </div>

    <div class="dimension right">
      <label for="rows">Rows</label>
      <input type="number" id="rows" value="50" min="1"
             aria-label="Number of rows">
    </div>
  </div>

  <p id="readout"></p>
  </div>

  <div class="panel">
    <fieldset>
      <legend>Yarn colors</legend>

      <div class="fields">
        <label for="lengthUnit">Length unit</label>
        <select id="lengthUnit">
          <option value="m">metres</option>
          <option value="cm">centimetres</option>
          <option value="ft">feet</option>
          <option value="yd">yards</option>
          <option value="in">inches</option>
        </select>
      </div>

      <div class="colorHeader">
        <span>Color</span>
        <span id="lengthHeading">Length (m)</span>
        <span></span>
      </div>

      <div id="colorRows"></div>
      <button type="button" id="addColor">+ Add color</button>
    </fieldset>

    <fieldset id="construction">
      <legend>Construction</legend>
      <label class="choice">
        <input type="radio" name="construction" value="flat" checked>
        Flat — knitted back and forth, every other row reversed
      </label>
      <label class="choice">
        <input type="radio" name="construction" value="circular">
        Circular — knitted in the round, a continuous spiral
      </label>
    </fieldset>

    <fieldset>
      <legend>Gauge</legend>
      <div class="fields">
        <label for="gaugeUnit">Measured in</label>
        <select id="gaugeUnit">
          <option value="mm" selected>millimetres</option>
          <option value="in">inches</option>
        </select>

        <label for="stitchWidth">Stitch width</label>
        <input type="number" id="stitchWidth" value="4.5" step="0.01" min="0.01">

        <label for="rowHeight">Row height</label>
        <input type="number" id="rowHeight" value="3.3" step="0.01" min="0.01">
      </div>

      <details class="swatch">
        <summary>Work it out from a swatch</summary>
        <p class="hint">Knit a sample, count what went into it, then measure it.</p>

        <div class="fields">
          <label for="swatchUnit">Measured in</label>
          <select id="swatchUnit">
            <option value="cm" selected>centimetres</option>
            <option value="in">inches</option>
          </select>
        </div>

        <div class="fields fieldsSwatch">
          <label for="swatchWidth">Measured width</label>
          <input type="number" id="swatchWidth" value="10" step="0.1" min="0.1">
          <label for="swatchStitches">Stitches</label>
          <input type="number" id="swatchStitches" value="22" min="1">

          <label for="swatchHeight">Measured height</label>
          <input type="number" id="swatchHeight" value="10" step="0.1" min="0.1">
          <label for="swatchRows">Rows</label>
          <input type="number" id="swatchRows" value="30" min="1">
        </div>

        <button type="button" id="applySwatch">Use this gauge</button>
        <p class="hint" id="swatchResult"></p>
      </details>
    </fieldset>

    <fieldset>
      <legend>Yarn</legend>
      <div class="fields">
        <label for="perStitch">Yarn per stitch</label>
        <span class="withUnit">
          <input type="number" id="perStitch" value="5" step="0.1" min="0.01">
          <select id="perStitchUnit" aria-label="Yarn per stitch unit">
            <option value="m">metres</option>
            <option value="cm" selected>centimetres</option>
            <option value="ft">feet</option>
            <option value="yd">yards</option>
            <option value="in">inches</option>
          </select>
        </span>
      </div>
    </fieldset>
  </div>
  </div>

  <script src="yarn.js"></script>
  <script src="construction.js"></script>
  <script src="render.js"></script>
  <script src="geometry.js"></script>
  <script src="controls.js"></script>
  <script src="app.js"></script>
</body>
</html>
