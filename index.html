<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planned Pooling</title>
</head>
<body>
  <h1>Planned Pooling</h1>

  <form id="controls">
    <fieldset>
      <legend>Yarn colors</legend>
      <div id="colorRows"></div>
      <button type="button" id="addColor">+ Add color</button>
    </fieldset>

    <label for="stitches">Stitches per row</label>
    <input type="number" id="stitches" value="140" min="1">

    <label for="rows">Rows</label>
    <input type="number" id="rows" value="50" min="1">

    <label for="perStitch">Yarn per stitch (m)</label>
    <input type="number" id="perStitch" value="0.05" step="0.01" min="0.001">

    <button type="button" id="drawButton">Draw</button>
  </form>

  <canvas id="fabric" width="800" height="600"></canvas>

  <script src="yarn.js"></script>
  <script src="construction.js"></script>
  <script src="render.js"></script>
  <script src="controls.js"></script>
  <script src="app.js"></script>
</body>
</html>
